<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Weekly Schedule</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chores">
<meta name="theme-color" content="#FFF6E8">
<script>try{var __s=JSON.parse(localStorage.getItem("chorechart.v1"));document.documentElement.setAttribute("data-theme",(__s&&__s.opts&&__s.opts.theme)||"sunrise")}catch(e){document.documentElement.setAttribute("data-theme","sunrise")}</script>
<style>
:root{
  --bg:#FFF6E8;--surface:#FFFFFF;--ink:#2A2A55;--muted:#66668A;--line:#F0D7B0;
  --c-health:#C2410C;--c-help:#0A7E78;--c-char:#6741D9;
  --t-health:#FFE3D3;--t-help:#D3F2EF;--t-char:#E7E0FF;
  --danger:#C92A2A;
  --font:"Avenir Next","Trebuchet MS",Verdana,sans-serif;--tt:none;--glow:none;--ls:0;--h1fs:26px;
  --cardsh:0 1px 4px rgba(42,42,85,.10);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="ocean"]{
  --bg:#E9F5FF;--surface:#FFFFFF;--ink:#0B3A66;--muted:#4E7396;--line:#BCDDF3;
  --c-health:#0A7D56;--c-help:#B35F00;--c-char:#1D5FD0;
  --t-health:#D5F3E6;--t-help:#FFEBCC;--t-char:#DCE8FF;
  --danger:#C62F3A;--cardsh:0 1px 4px rgba(11,58,102,.12);
}
:root[data-theme="matrix"]{
  --bg:#000000;--surface:rgba(2,16,8,.86);--ink:#00FF41;--muted:#2FB257;--line:#0B4D22;
  --c-health:#00FF41;--c-help:#2EF2D0;--c-char:#C6FF3D;
  --t-health:#03260F;--t-help:#032624;--t-char:#1B2605;
  --danger:#FF4D4D;
  --font:"SF Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace;--tt:uppercase;--glow:0 0 10px #00FF41;--ls:1px;--h1fs:22px;
  --cardsh:0 0 14px rgba(0,255,65,.08);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:520px;margin:0 auto;padding:14px 12px 40px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
h1{margin:0;font-family:var(--font);font-size:var(--h1fs);line-height:1.15;letter-spacing:var(--ls);text-transform:var(--tt);text-shadow:var(--glow)}
.total{background:var(--ink);color:var(--bg);border-radius:14px;padding:6px 12px;text-align:center;min-width:72px}
.total b{display:block;font-size:26px;line-height:1}
.total span{display:block;font-size:12px}
.gear{background:none;border:0;font-size:20px;padding:4px 6px;color:var(--muted)}
.nav{display:flex;align-items:center;justify-content:space-between;margin:12px 0 8px}
.nav button{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:42px;height:38px;font-size:18px}
.nav button:disabled{opacity:.35}
.nav .range{font-weight:700}
.nav .range small{display:block;font-weight:400;color:var(--muted);font-size:12px;text-align:center}
.days,.row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days div{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.days div b{display:block;font-size:14px;color:var(--ink)}
.days .today b{background:var(--ink);color:var(--bg);border-radius:8px}
.cat{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 8px 10px;box-shadow:var(--cardsh)}
.cat h2{margin:0 0 6px 2px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.cat h2 i{font-style:normal;font-weight:400;font-size:13px;color:var(--muted)}
.cell{display:flex;flex-direction:column;gap:3px}
.slot{height:30px;border-radius:8px;border:2px dashed var(--line);background:transparent;font-weight:700;font-size:13px;padding:0}
.slot:disabled{opacity:.35;cursor:default}
.slot.on{border-style:solid;border-color:transparent;color:var(--ink)}
.health .slot.on{background:var(--t-health);box-shadow:inset 0 0 0 2px var(--c-health)}
.help .slot.on{background:var(--t-help);box-shadow:inset 0 0 0 2px var(--c-help)}
.char .slot.on{background:var(--t-char);box-shadow:inset 0 0 0 2px var(--c-char)}
.hint{color:var(--muted);font-size:12.5px;margin:12px 2px 0;line-height:1.4}
.rule{margin:10px 0 0;padding:9px 12px;border-radius:12px;background:var(--t-help);border:1.5px solid var(--c-help);font-size:14px;line-height:1.35;display:flex;gap:10px;align-items:center;justify-content:space-between}
.rule button{flex:none;border:1.5px solid var(--c-help);background:var(--surface);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px}
.slot.pend{opacity:.7}
.cat .slot.on.late{background:var(--line);box-shadow:inset 0 0 0 2px var(--muted);color:var(--muted)}
.rv{padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.rv div{margin-top:2px}
.rv small{color:var(--muted)}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.28;pointer-events:none;display:none}
:root[data-theme="matrix"] #rain{display:block}
.app{position:relative;z-index:1}
.lrow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.lrow button{flex:none;background:none;border:0;color:var(--muted);font-size:15px;padding:8px}
.chk{display:flex;align-items:center;gap:10px;flex:1;padding:7px 0;font-size:14.5px;line-height:1.3}
.chk input{width:20px;height:20px;flex:none;accent-color:var(--ink)}
.addrow input{flex:1;min-width:0}
.themes{display:flex;gap:8px}
.tsw{flex:1;border-radius:12px;border:2px solid var(--line);padding:10px 4px;font:inherit;text-align:center;font-size:14px}
.tsw b{display:block;margin-bottom:6px;font-weight:700}
.tsw i{display:inline-block;width:14px;height:14px;border-radius:50%;margin:0 2px}
.tsw.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.tier{display:flex;gap:4px;flex:none;margin:0}
.tier button{width:36px;height:36px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;padding:0}
.tier button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 2px;font-size:19px}
.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:10px}
label.f{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
.combo{position:relative}
.combo input,.sheet input[type=text],.sheet input[type=password],.sheet input[type=date],.sheet textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.combo input:focus,.sheet input:focus,.sheet textarea:focus{outline:2px solid var(--accent,var(--c-char));outline-offset:1px}
.opts{margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:170px;overflow:auto}
.opts button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;font-size:15px}
.opts button:last-child{border-bottom:0}
.opts .add{font-weight:700;color:var(--accent)}
.opts small{color:var(--muted);margin-left:8px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--accent-t);border:1.5px solid var(--accent);border-radius:999px;padding:5px 6px 5px 11px;font-size:14px;display:flex;gap:6px;align-items:center}
.chip button{background:none;border:0;font-size:16px;line-height:1;padding:0 4px;color:var(--muted)}
.chip button.bn{font-size:12px;font-weight:700;border:1.5px solid var(--accent);border-radius:999px;padding:3px 8px;color:var(--ink)}
.chip button.bn.on{background:var(--accent);color:var(--surface)}
.actions{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.dng{color:var(--danger)}
.msg{color:var(--danger);font-size:13px;margin-top:6px;min-height:16px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.li button{background:none;border:0;color:var(--danger);font-size:13px}
.li em{font-style:normal;font-size:11.5px;color:var(--muted);margin-left:6px}
details{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
summary{font-weight:700;cursor:pointer;padding:4px 0}
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow button{padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="app" id="app"></div>
<div id="layer"></div>
<script>
"use strict";
var KEY="chorechart.v1";
var CATS=[
  {id:"health",name:"Be Healthy",cls:"health",color:"var(--c-health)",tint:"var(--t-health)"},
  {id:"help",name:"Help Out",cls:"help",color:"var(--c-help)",tint:"var(--t-help)"},
  {id:"char",name:"Develop Character",cls:"char",color:"var(--c-char)",tint:"var(--t-char)"}
];
var DEF={
  health:{h:[],
          e:["30 min upper body workout x2","30 min lower body workout x2","30 min cardio workout x2","Floss x2","Played a sport for at least 60 mins"]},
  help:{h:[],
        e:["Walk Dog for 20 mins. minimum","Empty and fill dishwasher","Wash pots and pans in sink","Help cook a meal for min. 20 mins.","Dust your room","Vacuum the house (all floors)","Mow/shovel/rake the lawn","Pick up all the dog poop","Brush the dog and cat","Clean a common area well"]},
  char:{h:[],
        e:["Read for 1 hour","Practice a useful skill for 30 minutes","Create something for 1 hour","Do a random act of kindness for someone","Research something in depth and teach someone about it"]}
};
var LIB={
 health:[["Exercise",["30 min upper body workout x2","30 min lower body workout x2","30 min cardio workout x2","Played a sport for at least 60 mins","Go for a 30 min walk or run","Stretch or do yoga for 15 mins","Practice a sport skill for 30 mins"]],
  ["Self-care",["Floss x2","Brush teeth morning and night","Drink 1 L of water","Get 8+ hours of sleep","Shower and clean up"]],
  ["Food",["Eat a fruit or vegetable with every meal","Prepare a healthy snack","No sugary drinks today"]],
  ["Screens and mind",["Screen-free for 1 hour before bed","Meditate or breathe quietly for 10 minutes","Spend 30 minutes outside"]]],
 help:[["Kitchen",["Empty and fill dishwasher","Wash pots and pans in sink","Help cook a meal for min. 20 mins.","Wipe counters and table after a meal","Pack your own lunch","Set or clear the table"]],
  ["Cleaning",["Dust your room","Vacuum the house (all floors)","Clean a common area well","Clean the bathroom (sink, toilet, mirror)","Take out the garbage and recycling","Tidy your room completely (floor, bed, desk)"]],
  ["Pets",["Walk Dog for 20 mins. minimum","Pick up all the dog poop","Brush the dog and cat","Feed and water the pets","Clean the litter box"]],
  ["Yard and outdoors",["Mow/shovel/rake the lawn","Water the plants or garden","Sweep the porch or driveway","Wash the car"]],
  ["Laundry",["Do a full load of laundry (wash, dry, fold)","Put away your clean clothes","Change your bed sheets","Fold and put away family laundry"]],
  ["Family",["Help a sibling with homework for 20 mins","Run an errand for the family","Help a neighbour or relative with a task"]]],
 char:[["Reading and learning",["Read for 1 hour","Practice a useful skill for 30 minutes","Research something in depth and teach someone about it","Learn something new online for 30 minutes","Practice an instrument for 30 minutes","Practice a language for 20 minutes","Do homework without being reminded","Study for a test for 45 minutes"]],
  ["Creating",["Create something for 1 hour","Write in a journal for 10 minutes","Cook a meal for the family","Build or fix something"]],
  ["Kindness",["Do a random act of kindness for someone","Spend 30 minutes of screen-free time with family","Call or write to a relative or friend","Thank someone sincerely"]],
  ["Responsibility",["Plan your week and goals for 10 minutes","Budget or save some of your money","Handle a task or appointment yourself","Volunteer for 1 hour"]]]
};
var GROUP={};CATS.forEach(function(c){GROUP[c.id]={};LIB[c.id].forEach(function(g){g[1].forEach(function(t){GROUP[c.id][t.toLowerCase()]=g[0]})})});
var DAYN=["Sat","Sun","Mon","Tue","Wed","Thu","Fri"];
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var mem=null;

function fresh(){
  var lists={};
  CATS.forEach(function(c){lists[c.id]={h:DEF[c.id].h.map(function(t){return{t:t}}),e:DEF[c.id].e.map(function(t){return{t:t}})}});
  return{v:7,name:"",pin:"",lists:lists,logs:{}};
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}
  return mem||fresh();
}
function save(){
  mem=S;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
}
var S=load();S.pens=S.pens||[];S.opts=S.opts||{own:true};S.tiers=S.tiers||{};
(function(){if(S.v>=2)return;var m=S.lists&&S.lists.help;if(m){["h","e"].forEach(function(k){var cust=m[k].filter(function(it){return it.custom});m[k]=DEF.help[k].map(function(t){return{t:t}}).concat(cust)})}S.v=2;save()})();
(function(){if(S.v>=3)return;var m=S.lists&&S.lists.health;if(m){var cust=(m.h||[]).concat(m.e||[]).filter(function(it){return it.custom});m.h=[];m.e=DEF.health.e.map(function(t){return{t:t}}).concat(cust)}S.v=3;save()})();
(function(){if(S.v>=4)return;CATS.forEach(function(c){var m=S.lists&&S.lists[c.id];if(!m)return;var seen={},out=[];(m.h||[]).concat(m.e||[]).forEach(function(it){var k=it.t.toLowerCase();if(!seen[k]){seen[k]=1;out.push(it)}});m.h=[];m.e=out});S.v=4;save()})();
(function(){if(S.v>=5)return;var m=S.lists&&S.lists.health,t="Played a sport for at least 60 mins";if(m&&!m.e.some(function(it){return it.t.toLowerCase()===t.toLowerCase()}))m.e.push({t:t});S.v=5;save()})();
(function(){if(S.v>=6)return;var m=S.lists&&S.lists.help;if(m){var cust=(m.h||[]).concat(m.e||[]).filter(function(it){return it.custom});m.h=[];m.e=DEF.help.e.map(function(t){return{t:t}}).concat(cust)}S.v=6;save()})();
(function(){if(S.v>=7)return;var m=S.lists&&S.lists.char;if(m){var cust=(m.h||[]).concat(m.e||[]).filter(function(it){return it.custom});m.h=[];m.e=DEF.char.e.map(function(t){return{t:t}}).concat(cust)}S.v=7;save()})();
(function(){
  if(S.v>=8)return;
  CATS.forEach(function(c){
    var m=S.lists&&S.lists[c.id];if(!m)return;
    var have={};
    m.e.forEach(function(it){var k=it.t.toLowerCase();have[k]=1;var g=GROUP[c.id][k];if(g&&!it.custom)it.g=g});
    LIB[c.id].forEach(function(grp){grp[1].forEach(function(t){var k=t.toLowerCase();if(!have[k]){m.e.push({t:t,g:grp[0],on:false});have[k]=1}})});
  });
  S.v=8;save();
})();

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);return x}
function weekStart(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+1)%7))}
function isCap(t){return /x2$/i.test(t)}
function money(n){return(n<0?"−$":"$")+Math.abs(n)}

function prune(){
  var cutoff=ymd(addDays(new Date(),-183)),ch=false;
  Object.keys(S.logs).forEach(function(k){if(k<cutoff){delete S.logs[k];ch=true}});
  var np=S.pens.filter(function(p){return p.d>=cutoff});if(np.length!==S.pens.length){S.pens=np;ch=true}
  if(ch)save();
}
prune();

var today=function(){return new Date()};
var V={ws:weekStart(today())};

function status(sl){return sl.a?"ok":((Date.now()-(sl.t||Date.now()))>864e5?"late":"pend")}
function pendList(){
  var out=[];
  Object.keys(S.logs).sort().forEach(function(d){
    CATS.forEach(function(c){
      ((S.logs[d]||{})[c.id]||[]).forEach(function(sl,i){if(sl&&!sl.a)out.push({d:d,c:c,i:i,sl:sl,st:status(sl)})});
    });
  });
  return out;
}
function weekTotal(ws){
  var base=0,bonus=0,pend=0,cap={};
  for(var i=0;i<7;i++){
    var L=S.logs[ymd(addDays(ws,i))]||{};
    CATS.forEach(function(c){
      (L[c.id]||[]).forEach(function(sl){
        if(!sl)return;
        var st=status(sl),b=sl.b||[],pp=sl.p||{},v=0,vb=0;
        sl.h.forEach(function(t){v+=pp["h:"+t]||1;if(b.indexOf("h:"+t)>=0)vb++});
        sl.e.forEach(function(t){
          var ok=true;
          if(isCap(t)){cap[t]=(cap[t]||0)+1;ok=cap[t]<=2}
          if(ok){v+=pp["e:"+t]||1;if(b.indexOf("e:"+t)>=0)vb++}
        });
        if(st==="ok"){base+=v;bonus+=vb}else if(st==="pend")pend++;
      });
    });
  }
  var pen=0,pa=ymd(ws),pz=ymd(addDays(ws,6));
  S.pens.forEach(function(p){if(p.d>=pa&&p.d<=pz)pen+=p.amt});
  return{base:base,bonus:bonus,pen:pen,total:base+bonus-pen,pend:pend};
}
function weekCountOf(ws,cat,item,exDay,exSlot){
  var n=0;
  for(var i=0;i<7;i++){
    var k=ymd(addDays(ws,i)),sl=((S.logs[k]||{})[cat]||[]);
    sl.forEach(function(s,idx){
      if(!s||(k===exDay&&idx===exSlot))return;
      s.e.forEach(function(t){if(t===item)n++});
    });
  }
  return n;
}

/* ---------- main screen ---------- */
function render(){
  var cur=weekStart(today()),isCur=ymd(V.ws)===ymd(cur),oldest=weekStart(addDays(today(),-183));
  var end=addDays(V.ws,6),t=ymd(today()),wt=weekTotal(V.ws);
  var h='<header><div><h1>'+(S.name?esc(S.name)+"’s Week":"My Week")+'</h1></div>'
    +'<div style="display:flex;gap:6px;align-items:flex-start"><button class="gear" data-a="settings" aria-label="Parent settings">⚙︎</button>'
    +'<div class="total"><b>'+money(wt.total)+'</b><span>'+(wt.bonus?'incl. $'+wt.bonus+' bonus':'approved')+'</span>'+(wt.pen?'<span>after −$'+wt.pen+' penalties</span>':'')+(wt.pend?'<span>'+wt.pend+' log'+(wt.pend>1?'s':'')+' waiting</span>':'')+'</div></div></header>';
  var pc=pendList().filter(function(r){return r.st==="pend"}).length;
  h+='<div class="rule"><span><b>Parent check:</b> a parent must approve your logs within 24 hours or they won’t count.</span><button data-a="review">Parent area'+(pc?' ('+pc+')':'')+'</button></div>';
  h+='<div class="nav"><button data-a="prev" aria-label="Previous week"'+(V.ws<=oldest?" disabled":"")+'>‹</button>'
    +'<div class="range">'+MON[V.ws.getMonth()]+' '+V.ws.getDate()+' – '+MON[end.getMonth()]+' '+end.getDate()
    +'<small>'+(isCur?"This week":(V.ws<cur?"Past week (view only)":"Next week"))+'</small></div>'
    +'<button data-a="next" aria-label="Next week"'+(isCur?" disabled":"")+'>›</button></div>';
  h+='<div class="days">';
  for(var i=0;i<7;i++){var d=addDays(V.ws,i);h+='<div class="'+(ymd(d)===t?"today":"")+'">'+DAYN[i]+'<b>'+d.getDate()+'</b></div>'}
  h+='</div>';
  CATS.forEach(function(c){
    var cnt=0;
    for(var i=0;i<7;i++){((S.logs[ymd(addDays(V.ws,i))]||{})[c.id]||[]).forEach(function(s){if(s&&(s.h.length+s.e.length))cnt++})}
    h+='<section class="cat '+c.cls+'"><h2>'+c.name+'<i>'+cnt+' of 14 logs</i></h2><div class="row">';
    for(var j=0;j<7;j++){
      var day=ymd(addDays(V.ws,j)),future=day>t,sl=((S.logs[day]||{})[c.id]||[]);
      h+='<div class="cell">';
      for(var s=0;s<2;s++){
        var x=sl[s],n=x?x.h.length+x.e.length:0,st=x?status(x):"";

/* ---------- log sheet ---------- */
var D=null,focus=null;
function layer(html){document.getElementById("layer").innerHTML=html?'<div class="scrim" id="scrim"><div class="sheet" id="sheet">'+html+'</div></div>':""}
function closeSheet(){layer("");D=null;focus=null}
function niceDate(k){var p=k.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);return DAYN[(d.getDay()+1)%7]+" "+MON[d.getMonth()]+" "+d.getDate()}

function openLog(day,cid,idx){
  var cat=CATS.filter(function(c){return c.id===cid})[0];
  var ro=V.ws<weekStart(today());
  var ex=((S.logs[day]||{})[cid]||[])[idx];
  ro=ro||!!(ex&&status(ex)==="late");
  var lock=!ro&&!!(ex&&ex.a);ro=ro||lock;
  D={day:day,cid:cid,idx:idx,cat:cat,ro:ro,lock:lock,h:ex?ex.h.slice():[],e:ex?ex.e.slice():[],b:ex&&ex.b?ex.b.slice():[],q:{h:"",e:""}};
  if(D.h.length){D.e=D.e.concat(D.h.filter(function(t){return D.e.indexOf(t)<0}));D.b=D.b.map(function(x){return x.charAt(0)==="h"?"e"+x.slice(1):x});D.h=[]}
  focus=null;
  var html='<div style="--accent:'+cat.color+';--accent-t:'+cat.tint+'">'
    +'<h3>'+cat.name+'</h3><div class="sub">'+niceDate(day)+' · Log '+(idx+1)+(ro?" · view only":"")+(ex?' · '+({ok:"Approved ✓",pend:"Waiting for parent",late:"Not approved in time"})[status(ex)]:"")+'</div>'+(lock?'<div class="sub" style="margin-top:-6px">Approved logs can\u2019t be edited, but you can remove one.</div>':"")+(ro?"":'<div class="sub" style="margin-top:-6px">Tap “On my own, without being asked!” to earn a $1 bonus. A parent sets the points for each chore when they approve it. <b>A parent must approve this log within 24 hours for it to count. Changing an approved log sends it back for approval.</b></div>')
    

    +'<label class="f" for="in-e">What did you do?</label><div class="combo">'+(ro?"":'<input id="in-e" type="text" placeholder="Pick or type your own" autocomplete="off">')+'<div class="chips" id="ch-e"></div><div id="op-e"></div></div>'
    +'<div class="actions">'+(lock?'<button class="btn" data-s="close">Close</button><button class="btn dng" data-s="clear">Remove log</button>':ro?'<button class="btn pri" data-s="close">Close</button>'
      :'<button class="btn" data-s="close">Cancel</button>'+(ex?'<button class="btn dng" data-s="clear">Clear</button>':"")+'<button class="btn pri" data-s="save">Save</button>')
    +'</div></div>';
  layer(html);
  drawCombo("h");drawCombo("e");
  ["h","e"].forEach(function(k){
    var inp=document.getElementById("in-"+k);if(!inp)return;
    inp.addEventListener("focus",function(){focus=k;D.q[k]=inp.value;drawCombo(k)});
    inp.addEventListener("input",function(){focus=k;D.q[k]=inp.value;drawCombo(k)});
    inp.addEventListener("blur",function(){setTimeout(function(){if(focus===k&&document.activeElement!==inp){focus=null;if(D)drawCombo(k)}},180)});
    inp.addEventListener("keydown",function(ev){if(ev.key==="Enter"){ev.preventDefault();var q=inp.value.trim();if(q){var rt=resolveTyped(D.cid,q);if(rt)addItem(k,rt)}}});
  });
}
function drawCombo(k){
  if(!D)return;
  var c=document.getElementById("ch-"+k),o=document.getElementById("op-"+k);if(!c)return;
  c.innerHTML=D[k].map(function(t,i){var on=D.b.indexOf(k+":"+t)>=0;return'<span class="chip">'+esc(t)+((D.ro&&!on)?"":'<button class="bn'+(on?" on":"")+'" data-b="'+k+'" data-i="'+i+'" aria-pressed="'+on+'"'+(D.ro?" disabled":"")+'>'+(on?"On my own, without being asked! +$1":"On my own, without being asked!")+'</button>')+(D.ro?"":'<button data-r="'+k+'" data-i="'+i+'" aria-label="Remove">×</button>')+'</span>'}).join("");
  var q=(D.q[k]||"").trim().toLowerCase(),list=S.lists[D.cid][k],html="";
  if(!D.ro&&focus===k){
    var shown=list.filter(function(it){return it.on!==false&&D[k].indexOf(it.t)<0&&it.t.toLowerCase().indexOf(q)>=0});
    var typed=(D.q[k]||"").trim();
    var exact=list.some(function(it){return it.t.toLowerCase()===q})||D[k].some(function(t){return t.toLowerCase()===q});
    shown.forEach(function(it){
      var note="";
      if(isCap(it.t)){note='<small>'+Math.min(2,weekCountOf(V.ws,D.cid,it.t,D.day,D.idx)+D.e.filter(function(x){return x===it.t}).length)+' of 2 this week</small>'}
      html+='<button data-o="'+k+'" data-t="'+esc(it.t)+'"><span>'+esc(it.t)+(it.custom?'<small>yours</small>':'')+'</span>'+note+'</button>';
    });
    if(typed&&!exact&&S.opts.own!==false)html+='<button class="add" data-n="'+k+'">+ Add “'+esc(typed)+'”</button>';
    if(!html&&!typed&&!list.some(function(it){return it.on!==false}))html='<button disabled style="color:var(--muted)">No chores chosen yet. Ask a parent to add some.</button>';
    if(html)html='<div class="opts">'+html+'</div>';
  }
  o.innerHTML=html;
}
function resolveTyped(cid,q){
  var l=q.toLowerCase(),list=S.lists[cid].e,hit=null,any=false,i;
  for(i=0;i<list.length;i++){if(list[i].t.toLowerCase()===l){any=true;if(list[i].on!==false)hit=list[i].t}}
  if(hit)return hit;
  if(any)return null;
  return S.opts.own!==false?q:null;
}
function addItem(k,t){
  if(D[k].indexOf(t)<0)D[k].push(t);
  D.q[k]="";var inp=document.getElementById("in-"+k);if(inp)inp.value="";
  drawCombo(k);
}
document.getElementById("layer").addEventListener("mousedown",function(e){
  if(e.target.closest(".opts"))e.preventDefault();
});
document.getElementById("layer").addEventListener("click",function(e){
  var t=e.target;
  if(t.id==="scrim"){closeSheet();return}
  var b;
  if((b=t.closest("[data-o]"))&&D){addItem(b.dataset.o,b.dataset.t);return}
  if((b=t.closest("[data-n]"))&&D){var k=b.dataset.n;addItem(k,D.q[k].trim());return}
  if((b=t.closest("[data-b]"))&&D){var kk=b.dataset.b,key=kk+":"+D[kk][+b.dataset.i],pp=D.b.indexOf(key);if(pp>=0)D.b.splice(pp,1);else D.b.push(key);drawCombo(kk);return}
  if((b=t.closest("[data-r]"))&&D){var rk=b.dataset.r,rt=D[rk].splice(+b.dataset.i,1)[0],bp=D.b.indexOf(rk+":"+rt);if(bp>=0)D.b.splice(bp,1);drawCombo(rk);return}
  if((b=t.closest("[data-s]"))){
    var s=b.dataset.s;
    if(s==="close")closeSheet();
    else if(s==="clear"){if(D.lock&&!b.dataset.sure){b.dataset.sure="1";b.textContent="Tap again to remove";return}setSlot(null);closeSheet();render()}
    else if(s==="save"){
      ["h","e"].forEach(function(k){
        var inp=document.getElementById("in-"+k),q=inp?inp.value.trim():"";
        if(q){var rt=resolveTyped(D.cid,q);if(rt&&D[k].indexOf(rt)<0)D[k].push(rt)}
      });
      ["h","e"].forEach(function(k){
        var list=S.lists[D.cid][k];
        D[k].forEach(function(t){if(!list.some(function(it){return it.t.toLowerCase()===t.toLowerCase()}))list.push({t:t,custom:true})});
      });
      setSlot(D.h.length+D.e.length?{h:D.h,e:D.e,b:D.b.filter(function(x){return D[x.charAt(0)].indexOf(x.slice(2))>=0})}:null);
      closeSheet();render();
    }
    return;
  }
  if((b=t.closest("[data-p]")))settingsAction(b);
});
function setSlot(v){
  var L=S.logs[D.day]=S.logs[D.day]||{},arr=L[D.cid]=L[D.cid]||[null,null];
  var old=arr[D.idx];
  if(v&&old&&JSON.stringify([old.h,old.e,old.b||[]])===JSON.stringify([v.h,v.e,v.b]))return;
  if(v)v.t=(old&&!old.a&&old.t)?old.t:Date.now();
  arr[D.idx]=v;
  if(!arr[0]&&!arr[1]){delete L[D.cid];if(!Object.keys(L).length)delete S.logs[D.day]}
  save();
}

function settingsAction(b){

  else if(a==="enter"){if(document.getElementById("pin1").value===S.pin)afterPin();else document.getElementById("pmsg").textContent="That PIN doesn’t match."}
  else if(a==="theme"){keepName();S.opts.theme=b.dataset.v;save();applyTheme();openSettings()}
  else if(a==="lib"){if(b.dataset.f==="settings")keepName();LIBFROM=b.dataset.f;openLibrary()}
  else if(a==="lcat"){SC=b.dataset.c;openLibrary()}
  else if(a==="selall"||a==="clrall"){S.lists[SC].e.forEach(function(it){it.on=(a==="selall")});save();openLibrary()}
  else if(a==="ldel"){S.lists[SC].e.splice(+b.dataset.i,1);save();openLibrary()}
  else if(a==="ladd"){var nt=document.getElementById("new-e").value.trim(),lm=document.getElementById("lmsg");
    if(!nt){lm.textContent="Type a chore name first.";return}
    if(S.lists[SC].e.some(function(x){return x.t.toLowerCase()===nt.toLowerCase()})){lm.textContent="That chore is already in the list.";return}
    S.lists[SC].e.push({t:nt,on:true});save();openLibrary()}
  else if(a==="lrestore"){var hv={};S.lists[SC].e.forEach(function(x){hv[x.t.toLowerCase()]=1});
    LIB[SC].forEach(function(g){g[1].forEach(function(t){if(!hv[t.toLowerCase()]){S.lists[SC].e.push({t:t,g:g[0],on:false})}})});save();openLibrary()}
  else if(a==="ldone"){if(LIBFROM==="review")openReview();else openSettings()}
  else if(a==="copy"){var ta=document.getElementById("bk");ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}document.getElementById("bmsg").textContent=ok?"Copied.":"Select the text and copy it manually."}
  else if(a==="restore"){try{var o=JSON.parse(document.getElementById("bk").value);if(!o||!o.lists||!o.logs)throw 0;S=o;S.pens=S.pens||[];S.opts=S.opts||{own:true};S.tiers=S.tiers||{};save();prune();render();document.getElementById("bmsg").textContent="Restored."}catch(e){document.getElementById("bmsg").textContent="That text isn’t a valid backup."}}
  else if(a==="chpin"){S.pin="";save();openSetPin()}
  else if(a==="erase"){var m=document.getElementById("emsg");if(b.dataset.sure){S.logs={};S.pens=[];save();render();m.textContent="All logs erased."}else{b.dataset.sure="1";b.textContent="Tap again to confirm";}}
  else if(a==="addpen"){
    var w=document.getElementById("pn-w").value.trim(),am=document.getElementById("pn-a").value.trim(),dd=document.getElementById("pn-d").value,pm=document.getElementById("penmsg");
    if(!w){pm.textContent="Say what happened.";return}
    if(!/^\d{1,3}$/.test(am)||+am<1){pm.textContent="Enter a whole dollar amount.";return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dd)||dd>ymd(today())){pm.textContent="Pick today or an earlier date.";return}
    S.pens.push({id:Date.now(),d:dd,amt:+am,why:w,t:Date.now()});save();openReview(true)}
  else if(a==="delpen"){var pid=+b.dataset.id;S.pens=S.pens.filter(function(p){return p.id!==pid});save();openReview(true)}
  else if(a==="tier"){Array.prototype.forEach.call(b.parentNode.children,function(x){x.classList.remove("on")});b.classList.add("on")}
  else if(a==="appr"){approveCard(b.closest(".rv"));save();openReview()}
  else if(a==="apprall"){Array.prototype.forEach.call(document.querySelectorAll('.rv[data-st="pend"]'),approveCard);save();openReview()}
  else if(a==="rdone"){closeSheet();render()}
  else if(a==="done"){keepName();closeSheet();render()}
}
function approveCard(card){
  if(!card)return;
  var sl=((S.logs[card.dataset.d]||{})[card.dataset.c]||[])[+card.dataset.i];if(!sl)return;
  var pts={};
  Array.prototype.forEach.call(card.querySelectorAll(".tier"),function(t){
    var on=t.querySelector("button.on"),n=on?+on.dataset.v:1,key=t.getAttribute("data-key");
    pts[key]=n;S.tiers[key.slice(2).toLowerCase()]=n;
  });
  sl.p=pts;sl.a=true;
}
function keepName(){var n=document.getElementById("nm");if(n){S.name=n.value.trim();save()}}

(function(){
  var cv=document.getElementById("rain");if(!cv||!cv.getContext)return;
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches){cv.style.display="none";return}
  var cx=cv.getContext("2d");if(!cx)return;var ch="ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ0123456789".split(""),fs=16,cols=0,drops=[],last=0;
  function size(){cv.width=window.innerWidth;cv.height=window.innerHeight;cols=Math.ceil(cv.width/fs);drops=[];for(var i=0;i<cols;i++)drops[i]=Math.random()*cv.height/fs}
  size();window.addEventListener("resize",size);
  function frame(ts){
    if(!running)return;
    if(ts-last>75){
      last=ts;
      cx.fillStyle="rgba(0,0,0,.08)";cx.fillRect(0,0,cv.width,cv.height);
      cx.fillStyle="#00FF41";cx.font=fs+"px monospace";
      for(var i=0;i<cols;i++){
        cx.fillText(ch[Math.floor(Math.random()*ch.length)],i*fs,drops[i]*fs);
        if(drops[i]*fs>cv.height&&Math.random()>.975)drops[i]=0;
        drops[i]++;
      }
    }
    requestAnimationFrame(frame);
  }
  var running=false;
  window.setRain=function(on){if(on){size();if(!running){running=true;requestAnimationFrame(frame)}}else running=false};
})();
applyTheme();
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",function(){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}})}
render();
</script>
